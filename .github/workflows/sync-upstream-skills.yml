name: Sync upstream skills
on:
  schedule:
    # 00:00 UTC Monday = 08:00 Asia/Taipei Monday.
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out mirror
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Test dist conversion contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Sync upstream skills (main)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          chmod +x ./scripts/sync-skills.sh
          ./scripts/sync-skills.sh
      - name: Validate generated mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find skills -type f -name SKILL.md | wc -l | tr -d ' ')" -gt 0
          test -s metadata/source-commits.json
          test -s metadata/skill-imports.tsv
          while IFS=$'\t' read -r namespace skill_name skill_url upstream_url; do
            test -n "$namespace"
            test -n "$skill_name"
            test -n "$skill_url"
            test -n "$upstream_url"
          done < <(tail -n +2 metadata/skill-imports.tsv)
      - name: Commit clean mirror to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/sync-upstream-skills.yml scripts metadata skills
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream skills [clean mirror]"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "ERROR: Cannot rebase generated sync commit onto origin/main." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "ERROR: Failed to push main after 3 attempts." >&2
                exit 1
              fi
              echo "main advanced during sync; retrying push (attempt $((attempt + 1))/3)..."
              sleep $((attempt * 2))
            done
          else
            echo "No upstream changes detected on main."
          fi
      - name: Transform and push to dist branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout -B dist
          python3 scripts/transform-for-manus.py
          git add -A skills metadata
          if ! git diff --cached --quiet; then
            git commit -m "chore: transform skills for manus dist [skip ci]"
          fi
          # Secondary verification before force push
          echo "Verifying dist branch..."
          test "$(find skills -mindepth 3 -maxdepth 4 -type f -name SKILL.md | wc -l)" -gt 0
          python3 scripts/validate-dist.py
          git push origin dist --force
