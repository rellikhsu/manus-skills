name: Sync upstream skills

on:
  schedule:
    # 00:00 UTC Monday = 08:00 Asia/Taipei Monday.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream skills
        run: ./scripts/sync-skills.sh

      - name: Validate generated mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find skills -type f -name SKILL.md | wc -l | tr -d ' ')" -gt 0
          test -s metadata/source-commits.json
          test -s metadata/skill-imports.tsv
          while IFS=$'\t' read -r namespace skill_name skill_url upstream_url; do
            test -n "$namespace"
            test -n "$skill_name"
            test -n "$skill_url"
            test -n "$upstream_url"
          done < <(tail -n +2 metadata/skill-imports.tsv)

      - name: Commit changed mirror content
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/sync-upstream-skills.yml scripts metadata skills
          if git diff --cached --quiet; then
            echo "No upstream changes detected."
            exit 0
          fi
          git commit -m "chore: sync upstream skills"
          git push
